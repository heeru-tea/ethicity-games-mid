<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마지막 한 사람까지 · 윤리시티 연대성</title>
<link rel="stylesheet" href="../shared/ethicity-elementary-common-v1/runtime/common.css">
<link rel="stylesheet" href="game.css">
</head>
<body class="ee-theme game-solidarity">
<div class="gs-wrap">
  <header class="gs-hud" aria-label="게임 상태">
    <span class="ee-badge gs-round" id="roundChip">윤리시티 · 연대성</span>
    <span class="ee-badge" id="rainPill">시간당 80mm</span>
    <div class="gs-timer" role="progressbar" aria-label="남은 시간" aria-valuemin="0" aria-valuemax="100" id="timerWrap"><i id="timerBar"></i></div>
    <span class="ee-badge gs-ico-badge" id="safePill"></span>
    <span class="ee-badge gs-ico-badge" id="goodsPill" hidden></span>
    <button class="gs-iconbtn" id="soundBtn" aria-pressed="false" aria-label="효과음 켜기"></button>
    <button class="gs-iconbtn" id="helpBtn" aria-label="도움말"></button>
  </header>
  <div class="gs-map-wrap"><svg id="map" viewBox="0 0 1280 720" preserveAspectRatio="xMidYMid meet" aria-label="강변 마을 지도"></svg></div>
  <div class="gs-dock" id="dock" aria-label="봉사단과 마을방송"></div>
</div>
<div class="gs-overlay" id="overlay" hidden><div class="ee-panel gs-card" id="card" role="dialog" aria-modal="true" aria-live="polite"></div></div>
<div class="ee-notice gs-toast" id="toast" role="status" hidden></div>
<script src="../shared/ethicity-elementary-common-v1/runtime/manifest.js"></script>
<script src="../shared/ethicity-elementary-common-v1/runtime/common.js"></script>
<script src="game.js"></script>
</body>
</html>
