<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI 윤리 위원회 — 다양성의 기준을 정하라</title>
  <meta name="description" content="학교 곳곳을 조사하며 뉴스·광고·교육에서 AI의 다양성 보정 기준을 심의하는 탐험형 윤리 게임. 중·고등학생용.">
  <meta name="theme-color" content="#fff9e7">
  <!-- 공통 팩: common.css를 먼저, 게임 전용 CSS는 .game-diversity 아래로만 -->
  <link rel="stylesheet" href="../shared/ethicity-elementary-common-v1/runtime/common.css">
  <link rel="stylesheet" href="css/diversity.css">
</head>
<body class="ee-theme game-diversity">
  <a class="dv-skip" href="#panel">본문으로 건너뛰기</a>

  <header class="dv-hud" id="hud">
    <p class="dv-hud-where">
      <span id="hud-part" class="ee-badge" hidden></span>
      <span id="hud-place" class="dv-hud-place"></span>
    </p>
    <p class="dv-hud-task" id="hud-task" hidden><span class="dv-hud-task-label">지금 할 일</span> <span id="hud-task-text"></span></p>
    <div class="dv-progress" id="hud-progress" hidden>
      <span class="dv-sr" id="hud-progress-text"></span>
      <ol class="dv-steps" id="hud-steps" aria-hidden="true"></ol>
    </div>
    <button id="btn-menu" class="ee-button secondary dv-menu-btn" type="button" aria-haspopup="dialog">메뉴</button>
  </header>

  <main class="dv-main" id="main" data-layout="scene">
    <div class="dv-stage-wrap" id="stage-wrap">
      <div class="dv-stage-box">
        <canvas id="stage" class="dv-stage ee-pixel" role="img" aria-label="위원회 장면"></canvas>
        <!-- 탐험 화면에서 누를 수 있는 장소·인물(무대 위에 겹친 버튼) -->
        <div class="dv-spots" id="spots" role="group" aria-label="둘러볼 곳" hidden></div>
      </div>
    </div>
    <section class="dv-panel" id="panel" tabindex="-1" aria-label="진행 화면">
      <div class="ee-panel dv-card" id="loading" role="status">공통 그림을 불러오고 있습니다.</div>
    </section>
  </main>

  <!-- 대사 읽어 주기용(화면에는 보이지 않음) -->
  <p class="dv-sr" id="live" aria-live="polite"></p>
  <p class="ee-success dv-toast" id="toast" role="status" hidden></p>

  <!-- 메뉴 -->
  <div class="dv-overlay" id="menu" hidden>
    <div class="ee-panel dv-sheet" role="dialog" aria-modal="true" aria-labelledby="menu-title">
      <h2 id="menu-title">메뉴</h2>
      <fieldset class="dv-setting">
        <legend>대사 나오는 속도</legend>
        <label><input type="radio" name="speed" value="normal"> 보통</label>
        <label><input type="radio" name="speed" value="fast"> 빠르게</label>
        <label><input type="radio" name="speed" value="instant"> 한 번에</label>
      </fieldset>
      <label class="dv-setting dv-check"><input type="checkbox" id="opt-motion"> 움직임 줄이기 (화면 효과 멈춤)</label>
      <label class="dv-setting dv-check"><input type="checkbox" id="opt-sound"> 효과음</label>
      <div class="dv-menu-actions">
        <button id="btn-menu-home" class="ee-button secondary" type="button">처음 화면으로 (진행은 저장됨)</button>
        <button id="btn-menu-restart" class="ee-button secondary" type="button">처음부터 다시 하기</button>
        <button id="btn-menu-wipe" class="ee-button secondary" type="button">이 게임 기록 지우기</button>
      </div>
      <p class="dv-small">기록 지우기는 이 게임의 진행·작성한 글·설정만 지워요. 다른 게임 기록은 그대로예요.</p>
      <button id="btn-menu-close" class="ee-button" type="button">닫기</button>
    </div>
  </div>

  <!-- 확인 창 -->
  <div class="dv-overlay" id="confirm" hidden>
    <div class="ee-panel dv-sheet" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
      <h2 id="confirm-title"></h2>
      <p id="confirm-text"></p>
      <div class="dv-row">
        <button id="confirm-no" class="ee-button secondary" type="button">취소</button>
        <button id="confirm-yes" class="ee-button" type="button">확인</button>
      </div>
    </div>
  </div>

  <script src="../shared/ethicity-elementary-common-v1/runtime/manifest.js"></script>
  <script src="../shared/ethicity-elementary-common-v1/runtime/common.js"></script>
  <script src="js/story.js"></script>
  <script src="js/store.js"></script>
  <script src="js/stage.js"></script>
  <script src="js/walk.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
