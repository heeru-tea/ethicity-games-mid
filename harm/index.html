<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="AI 윤리 탐험대 침해금지 편 — 단톡방에 올라온 친구의 AI 합성 영상에 10초 안에 반응하고, 그 반응이 남긴 피해를 직접 되돌려 보는 고1 통합과학 수업용 게임">
<title>37개의 알림</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Silkscreen:wght@400;700&display=swap">
<style>
/* 책임성 편과 같은 디자인 토큰·부품을 쓰고, 이 편에서만 쓰는 휴대폰·지도·복도 부품을 더했다. */
:root {
  --night: #16231e;
  --moss: #26413a;
  --moss-2: #335a4c;
  --paper: #edf2e4;
  --paper-2: #dbe6cf;
  --ink: #13201a;
  --ink-soft: #4b5f54;
  --cap: #d94a3a;
  --yolk: #f2b33d;
  --sky: #79c2c6;
  --mute: #a4b8ab;
  --good: #4f9d5b;
  --f-display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-code: "Silkscreen", "Courier New", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--night);
  color: var(--paper);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
  -webkit-tap-highlight-color: transparent;
  background-image:
    radial-gradient(circle at 12% 0%, rgba(121,194,198,.10), transparent 40%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.015) 0 2px, transparent 2px 4px);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
img { max-width: 100%; }
button, input, textarea, select { font: inherit; color: inherit; }
img.sprite { image-rendering: pixelated; display: block; }
#app {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px 28px;
  display: flex; flex-direction: column; gap: 14px;
}

/* HUD */
.hud { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; justify-content: space-between; background: #f5ebcf; color: #1f2a22; border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.35); padding: 10px 16px; }
.brand-title { display: flex; flex-direction: column; gap: 0; line-height: 1.15; }
.brand-title .series { font-family: var(--f-display); font-weight: 700; font-size: 15px; color: #4f8a57; letter-spacing: .04em; }
.brand-title .ep { font-family: var(--f-display); font-weight: 400; font-size: 26px; color: #1f2a22; letter-spacing: .01em; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.hud-title { font-family: var(--f-display); font-size: 22px; color: var(--paper); display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.hud-title small { font-family: var(--f-code); font-size: 11px; color: var(--yolk); letter-spacing: .08em; }
.player { font-family: var(--f-display); font-size: 16px; color: var(--ink); background: var(--yolk); border: 3px solid var(--ink); padding: 2px 10px; }
.pips { display: flex; gap: 6px; flex-wrap: wrap; }
.pip { width: 34px; height: 34px; border: 3px solid var(--moss-2); background: var(--moss); display: grid; place-items: center; font-family: var(--f-code); font-size: 11px; color: var(--mute); }
.pip.done { background: var(--moss-2); color: var(--paper); }
.pip.now { border-color: var(--yolk); color: var(--yolk); box-shadow: 0 0 0 3px rgba(242,179,61,.25); }

#stage { min-height: 560px; }
.scene { display: grid; grid-template-columns: 220px minmax(0,1fr); gap: 18px; align-items: start; }
.scene.wide { grid-template-columns: minmax(0,1fr); }
.who { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 10px; background: var(--moss); border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.35); position: sticky; top: 12px; }
.who img { width: 128px; height: auto; }
.who .role { font-family: var(--f-display); font-size: 22px; color: var(--yolk); }
.who .name { font-size: 14px; color: var(--mute); }
.who .mission { font-size: 14px; color: var(--paper); text-align: center; line-height: 1.5; border-top: 2px dashed var(--moss-2); padding-top: 8px; }

.panel { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.35); padding: 18px 20px; min-width: 0; }
.panel + .panel { margin-top: 16px; }
.panel h2 { font-family: var(--f-display); font-weight: 400; font-size: 28px; line-height: 1.2; margin: 0 0 6px; text-wrap: balance; }
.panel h3 { font-family: var(--f-display); font-weight: 400; font-size: 21px; margin: 0 0 6px; }
.panel p { margin: 0 0 10px; max-width: 64ch; }
.eyebrow { font-family: var(--f-code); font-size: 11px; letter-spacing: .1em; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 4px; }
.hint { font-size: 14px; color: var(--ink-soft); }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }

.btn { font-family: var(--f-display); font-size: 20px; padding: 10px 20px 8px; min-height: 52px; background: var(--yolk); color: var(--ink); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); cursor: pointer; transition: transform .06s; touch-action: manipulation; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.btn.ghost { background: var(--paper-2); }
.btn.danger { background: var(--cap); color: #fff; }
.btn.sky { background: var(--sky); }
.btn.small { font-size: 16px; min-height: 42px; padding: 6px 14px 4px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: 0 5px 0 var(--ink); }
.btn:focus-visible, .chip:focus-visible, .choice:focus-visible, .node:focus-visible, .case:focus-visible, .hot:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }

/* Dialogue */
.talk { display: grid; grid-template-columns: 150px minmax(0,1fr); align-items: end; max-width: 860px; margin: 40px auto 0; }
.talk .face { background: var(--moss); border: 4px solid var(--ink); border-right: 0; padding: 10px; display: grid; place-items: center; height: 100%; }
.talk .face img { width: 120px; }
.talk .box { background: var(--paper); color: var(--ink); border: 4px solid var(--ink); box-shadow: 6px 6px 0 rgba(0,0,0,.35); padding: 16px 20px 14px; min-height: 190px; display: flex; flex-direction: column; gap: 8px; }
.talk .speaker { font-family: var(--f-display); font-size: 21px; color: var(--cap); }
.talk .line { font-size: 20px; line-height: 1.65; flex: 1; }
.talk .line b { background: linear-gradient(transparent 55%, rgba(242,179,61,.55) 55%); }
.talk .next { align-self: flex-end; }
.talk-scene { max-width: 860px; margin: 0 auto; width: 100%; }

.chip { font-family: var(--f-display); font-size: 17px; padding: 8px 14px; background: #fff; border: 3px solid var(--ink); cursor: pointer; touch-action: manipulation; color: var(--ink); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--yolk); }
.choice { text-align: left; background: #fff; color: var(--ink); border: 3px solid var(--ink); padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; box-shadow: 0 4px 0 var(--ink); }
.choice b { font-family: var(--f-display); font-weight: 400; font-size: 19px; }
.choice span { font-size: 14px; color: var(--ink-soft); }
.choice[aria-pressed="true"] { background: #fbe7b6; outline: 3px solid var(--ink); }
.choice[disabled] { opacity: .5; cursor: default; }
.choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.badge { display: inline-block; font-family: var(--f-display); font-size: 15px; padding: 2px 10px; border: 2px solid var(--ink); background: var(--yolk); color: var(--ink); }
.badge.red { background: var(--cap); color: #fff; }
.badge.sky { background: var(--sky); }
.badge.good { background: var(--good); color: #fff; }
.footer-nav { display: flex; gap: 12px; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--yolk); border: 3px solid var(--yolk); padding: 10px 18px; font-family: var(--f-display); font-size: 18px; z-index: 60; max-width: calc(100% - 32px); text-align: center; }

/* Title & login */
.title-screen { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 24px; align-items: center; min-height: 520px; }
.title-screen h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(40px, 6vw, 72px); line-height: 1.05; margin: 0 0 10px; color: var(--paper); text-wrap: balance; }
.title-screen h1 em { font-style: normal; color: var(--yolk); }
.title-screen .lead { font-size: 19px; color: var(--mute); max-width: 36ch; margin: 0 0 22px; }
.crew { display: flex; justify-content: center; align-items: flex-end; gap: 4px; flex-wrap: wrap; }
.crew img { width: 92px; }
.crew img:nth-child(odd) { transform: translateY(-14px); }
.login { max-width: 560px; margin: 40px auto 0; }
.login label { font-family: var(--f-display); font-size: 19px; display: block; margin-bottom: 6px; }
.login input { width: 100%; border: 4px solid var(--ink); background: #fff; color: var(--ink); padding: 12px 14px; font-size: 22px; font-family: var(--f-body); }
.login .err { color: var(--cap); font-size: 15px; min-height: 22px; }

/* Phone & chat (가상 채팅 앱 '모아톡') */
.phonewrap { display: grid; grid-template-columns: minmax(0, 360px) minmax(0,1fr); gap: 20px; align-items: start; }
.phone { width: 100%; max-width: 360px; background: var(--ink); border: 4px solid var(--ink); border-radius: 28px; padding: 14px 10px 18px; box-shadow: 6px 6px 0 rgba(0,0,0,.35); margin: 0 auto; position: relative; }
.screen { background: #f4f1ea; color: var(--ink); border-radius: 16px; min-height: 520px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.apphead { background: var(--moss-2); color: var(--paper); padding: 10px 12px; display: flex; align-items: center; gap: 8px; font-family: var(--f-display); font-size: 18px; }
.apphead small { font-family: var(--f-body); font-size: 13px; color: var(--paper-2); }
.apphead .brand { font-family: var(--f-code); font-size: 10px; color: var(--yolk); margin-left: auto; }
.chat { flex: 1; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.bub { display: flex; gap: 6px; align-items: flex-end; max-width: 92%; }
.bub .av { width: 34px; height: 34px; flex: none; background: var(--paper-2); border: 2px solid var(--ink); border-radius: 8px; overflow: hidden; }
.bub .av img { width: 100%; image-rendering: pixelated; }
.bub .col { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.bub .nm { font-size: 12px; color: var(--ink-soft); }
.bub .tx { background: #fff; border: 2px solid var(--ink); border-radius: 4px 12px 12px 12px; padding: 6px 10px; font-size: 15px; line-height: 1.4; }
.bub.me { align-self: flex-end; flex-direction: row-reverse; }
.bub.me .tx { background: var(--yolk); border-radius: 12px 4px 12px 12px; }
.bub.pop { animation: pop .3s steps(3) both; }
@keyframes pop { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
.vid { position: relative; width: 200px; aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 8px; cursor: pointer; padding: 0; }
.vid .say { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); background: rgba(19,32,26,.82); color: #fff; font-size: 12px; padding: 1px 8px; font-family: var(--f-display); white-space: nowrap; z-index: 4; }
.vid .dur { position: absolute; top: 4px; right: 6px; font-family: var(--f-code); font-size: 9px; color: #fff; background: rgba(19,32,26,.75); padding: 0 4px; z-index: 4; }
.vid.play .spr { animation: sway .5s steps(2) infinite; transform-origin: 50% 100%; }
@keyframes sway { 0% { transform: rotate(-5deg) translateX(-3%); } 100% { transform: rotate(5deg) translateX(3%); } }
.reacts { display: flex; gap: 6px; font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
.reacts span { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 0 8px; }
.reacts span.mine { background: var(--yolk); }
.timer { height: 18px; border: 3px solid var(--ink); background: var(--paper-2); position: relative; }
.timer i { position: absolute; inset: 0; background: var(--cap); transform-origin: left; }
.timer b { position: absolute; right: 6px; top: -3px; font-family: var(--f-code); font-size: 13px; color: var(--ink); }
.actbar { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 6px; padding: 10px; border-top: 3px solid var(--ink); background: #fff; }
.act { font-family: var(--f-display); font-size: 15px; line-height: 1.2; padding: 8px 2px 6px; text-align: center; border: 3px solid var(--ink); background: var(--paper); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; touch-action: manipulation; color: var(--ink); }
.act .ic { font-size: 22px; line-height: 1; }
.act[aria-pressed="true"] { background: var(--ink); color: var(--yolk); }
.act[disabled] { opacity: .45; }
.picker { position: absolute; left: 10px; right: 10px; bottom: 86px; background: #fff; border: 3px solid var(--ink); padding: 10px; display: grid; gap: 6px; box-shadow: 0 6px 0 rgba(0,0,0,.3); z-index: 5; }
.picker b { font-family: var(--f-display); font-weight: 400; }
.menu { position: absolute; left: 20px; right: 20px; top: 40%; background: #fff; border: 3px solid var(--ink); display: grid; z-index: 6; box-shadow: 0 6px 0 rgba(0,0,0,.3); }
.menu button { text-align: left; padding: 12px 14px; border: 0; border-bottom: 2px solid var(--paper-2); background: #fff; font-family: var(--f-display); font-size: 17px; cursor: pointer; color: var(--ink); }
.menu button.locked { color: #999; }
.menu button:last-child { border-bottom: 0; }
.rooms { display: grid; gap: 6px; padding: 10px; }
.roomrow { display: flex; justify-content: space-between; align-items: center; background: #fff; border: 2px solid var(--ink); padding: 8px 10px; font-family: var(--f-display); font-size: 16px; }
.roomrow.lock { background: var(--paper-2); color: var(--ink-soft); }

/* Lock screen */
.lock { background: linear-gradient(180deg, #2c3d52, #1d2a3a); color: #fff; min-height: 520px; border-radius: 16px; padding: 14px 10px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.lock .clock { font-family: var(--f-display); font-size: 54px; text-align: center; line-height: 1; }
.lock .date { text-align: center; font-size: 14px; color: #c9d6e2; margin-bottom: 6px; }
.lock .count { text-align: center; font-family: var(--f-display); font-size: 18px; color: var(--yolk); }
.noti { background: rgba(255,255,255,.92); color: var(--ink); border-radius: 12px; padding: 8px 12px; display: flex; flex-direction: column; gap: 0; touch-action: pan-y; user-select: none; cursor: grab; transition: transform .15s, opacity .15s; border: 2px solid transparent; }
.noti .t { font-family: var(--f-display); font-size: 15px; display: flex; justify-content: space-between; gap: 8px; }
.noti .t span { font-family: var(--f-code); font-size: 10px; color: var(--ink-soft); }
.noti .b { font-size: 14px; line-height: 1.4; }
.noti.mine { border-color: var(--yolk); box-shadow: 0 0 0 3px rgba(242,179,61,.6); }
.noti.gone { transform: translateX(110%); opacity: 0; }

/* Corridor */
.hall { position: relative; height: 320px; border: 4px solid var(--ink); overflow: hidden; touch-action: none; user-select: none; background: #efe7d2; cursor: pointer; }
.hall:focus-visible { outline: 4px solid var(--sky); outline-offset: 3px; }
.hall .world { position: absolute; left: 0; top: 0; width: 1800px; height: 320px; will-change: transform; }
.hall .world svg { position: absolute; inset: 0; display: block; }
.hall .ent { position: absolute; bottom: 34px; transform: translateX(-50%); }
.hall .ent img { width: 100%; image-rendering: pixelated; display: block; }
.hall .ent::after { content: ""; position: absolute; left: 18%; right: 18%; bottom: -6px; height: 10px; background: rgba(40,30,20,.28); border-radius: 50%; z-index: -1; }
.hall .kid { width: 96px; }
.hall .kid.look img { filter: drop-shadow(0 0 0 transparent); }
.hall .yh { width: 108px; z-index: 3; bottom: 28px; }
.hall .yh .body { transition: transform .12s steps(2); }
.hall .yh.left .body { transform: scaleX(-1); }
.hall .yh.walk img { animation: bob .28s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }
.hall .say { position: absolute; bottom: 150px; transform: translateX(-50%); background: #fff; color: var(--ink); border: 3px solid var(--ink); padding: 4px 10px; font-family: var(--f-display); font-size: 15px; white-space: nowrap; z-index: 4; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.hall .say::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 12px; height: 10px; background: inherit; border-right: 3px solid var(--ink); border-bottom: 3px solid var(--ink); transform: translateX(-50%) skewX(-20deg); }
.hall .say.kind { background: #e5f4e4; }
.hall .hud2 { position: absolute; left: 8px; right: 8px; top: 8px; display: flex; justify-content: space-between; gap: 8px; pointer-events: none; z-index: 5; }
.hall .hud2 span { font-family: var(--f-display); background: var(--ink); color: var(--yolk); padding: 2px 10px; font-size: 15px; }
.hall .hud2 .keys { color: var(--paper); background: rgba(19,32,26,.8); font-size: 13px; }
.hall .arrive { position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%); font-family: var(--f-display); font-size: 24px; background: var(--yolk); color: var(--ink); border: 4px solid var(--ink); padding: 6px 18px; z-index: 6; box-shadow: 0 5px 0 var(--ink); animation: pop .3s steps(3) both; white-space: nowrap; }
.walkpad { display: flex; gap: 10px; align-items: center; }
.walkpad .btn { min-width: 76px; font-size: 24px; }
.meter { display: flex; gap: 8px; align-items: center; font-family: var(--f-display); flex: 1; min-width: 160px; }
.meter .track { flex: 1; height: 16px; background: var(--paper-2); border: 3px solid var(--ink); }
.meter .fill { height: 100%; background: var(--cap); transition: width .2s; }
@media (max-width: 560px) { .hall .hud2 .keys { display: none; } .hall .say { font-size: 13px; } .hall .arrive { font-size: 19px; padding: 4px 12px; } }

/* 실감판: AI 생성 배경 (bg/ 폴더에 넣으면 자동 적용, 없으면 기본 그림) */
#backdrop { position: fixed; inset: 0; z-index: -1; background: center / cover no-repeat; opacity: 0; transition: opacity .6s; }
#backdrop.on { opacity: 1; }
#backdrop::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,24,20,.45), rgba(14,24,20,.72)); }
.lock.photo { background: linear-gradient(180deg, rgba(10,16,28,.35), rgba(10,16,28,.7)), var(--lockbg) center / cover; }
body.photo-corr .hall .world svg { display: none; }
body.photo-corr .hall .world { background: var(--corrbg) left top / auto 100% repeat-x; }
.hall .goalplate { position: absolute; top: 52px; white-space: nowrap; transform: translateX(-50%); font-family: var(--f-display); font-size: 18px; background: var(--yolk); color: var(--ink); border: 3px solid var(--ink); padding: 2px 12px; z-index: 2; display: none; }
body.photo-corr .hall .goalplate { display: block; }
body.photo-title .crew { display: none; }
body.photo-lab .lab { background: var(--labbg) center / cover; }
/* 실감판: 영상 분석 화면 */
.forensic { background: #0f1714; border: 4px solid var(--ink); padding: 10px; display: grid; gap: 8px; max-width: 620px; margin: 0 auto; box-shadow: 6px 6px 0 rgba(0,0,0,.35); }
.fx-top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-code); font-size: 11px; color: #9fb3a7; }
.fx-file { color: #e8efe9; } .fx-file::first-letter { color: var(--cap); }
.viewer { width: 100%; border: 2px solid #000; cursor: crosshair; }
.viewer.lensing { cursor: none; }
.viewer .paused { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); font-family: var(--f-code); font-size: 11px; color: #fff; background: rgba(0,0,0,.55); padding: 1px 8px; z-index: 6; }
.viewer.play .paused { display: none; }
.viewer.play .spr { animation: sway .5s steps(2) infinite; transform-origin: 50% 100%; filter: blur(1.2px); }
.viewer.play .hot { pointer-events: none; }
.viewer .grain { position: absolute; inset: 0; z-index: 4; pointer-events: none; opacity: .16; mix-blend-mode: multiply;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation: grain .4s steps(3) infinite; }
.viewer .grain::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%), repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 1px, transparent 1px 3px); mix-blend-mode: normal; opacity: 2.5; }

       <div class="row">${SEARCHES.map(q => `<a class="chip" style="text-decoration:none" target="_blank" rel="noopener" href="https://search.naver.com/search.naver?where=news&query=${encodeURIComponent(q)}">🔎 ${q}</a>`).join("")}</div>
       <div class="eyebrow" style="margin-top:6px">기사 고르기 체크</div>
       <ul class="checks"><li>언론사와 날짜가 있나요?</li><li>최근 3년 안의 기사인가요?</li><li>누구의 말인지(기관·전문가·당사자) 밝혀져 있나요?</li><li>성적인 합성물 내용이 자세히 나오는 기사는 고르지 마세요.</li></ul>
       <p class="hint">5분 안에 마땅한 기사를 못 찾으면 위의 샘플 사례를 골라도 괜찮아요.</p>`
    : `<ul>${c.pts.map(p => `<li>${p}</li>`).join("")}</ul>
       <div class="ask"><div class="eyebrow">생각해 볼 질문</div>${c.q}</div>
       <div class="links"><span class="eyebrow">원문 기사</span>${c.links.map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t} ↗</a>`).join("")}</div>`;
  const R = S.refl;
  $("#cd").innerHTML = `<section class="panel" style="margin-top:16px">
    <div class="detail"><div class="eyebrow">${c.when}</div><h2>${c.title}</h2>${body}</div>
    <h2 style="margin-top:20px">사례 보고서</h2>
    <form class="form" id="rf">
      ${c.own ? `<div class="q"><label for="q-title">내가 찾은 기사 제목과 주소</label><input type="text" id="q-title" value="${esc(R.title)}" placeholder="예: ○○일보, 2026.10.○ / 기사 주소"></div>` : ""}
      <div class="q"><label for="q-sum">① 사건 요약 — 누가, 무엇을 합성해, 어떻게 퍼졌나요? (2문장)</label><textarea id="q-sum">${esc(R.sum)}</textarea></div>
      <div class="q"><label for="q-fact">② 확인한 사실 — 기사에서 확인한 숫자·날짜·기관 하나, 아직 확인되지 않은 것 하나</label><textarea id="q-fact" placeholder="확인함: … / 아직 모름: …">${esc(R.fact)}</textarea></div>
      <div class="q"><span class="ql">③ 대응 제안 — 누구의 자리에서 제안할까요?</span>
        <div class="row" id="q-who">${WHO.map(w => `<button type="button" class="chip" aria-pressed="${R.who === w}">${w}</button>`).join("")}</div>
        <textarea id="q-fix" aria-label="대응 제안" placeholder="예: 플랫폼은 당사자가 요청하면 합성 영상을 먼저 가려 두어야 한다.">${esc(R.fix)}</textarea></div>
      <div class="q"><label for="q-me">게임 속 내 10초와 비교해 보니, 바뀐 생각은?</label><textarea id="q-me" placeholder="예: 공감 하나는 별거 아니라고 생각했는데…">${esc(R.me)}</textarea></div>
      <div class="footer-nav"><button class="btn" type="submit">생각 카드 만들기 ▶</button></div>
    </form>
    <div id="cardout"></div>
  </section>`;
  if (!quiet) $("#cd").scrollIntoView({ behavior: "smooth", block: "start" });
  const sync = () => {
    S.refl.title = $("#q-title") ? $("#q-title").value : S.refl.title;
    S.refl.sum = $("#q-sum").value; S.refl.fact = $("#q-fact").value; S.refl.fix = $("#q-fix").value; S.refl.me = $("#q-me").value;
    save();
  };
  $$("#q-who .chip").forEach(b => b.onclick = () => { $$("#q-who .chip").forEach(x => x.setAttribute("aria-pressed", x === b)); S.refl.who = b.textContent; sync(); });
  $("#rf").addEventListener("input", sync);
  $("#rf").addEventListener("submit", ev => {
    ev.preventDefault(); sync();
    const R2 = S.refl, e = ending();
    if (!R2.sum || !R2.sum.trim()) { toast("사건 요약을 적어 주세요"); $("#q-sum").focus(); return; }
    if (!R2.fix || !R2.fix.trim()) { toast("대응 제안을 적어 주세요"); $("#q-fix").focus(); return; }
    const caseName = c.own ? (R2.title || "직접 찾은 기사") : c.title;
    const text = `[AI 윤리 탐험대 · 침해금지 편 생각 카드]\n닉네임: ${nick()}\n내 엔딩: ${e} ${ENDINGS[e].t} (10초 반응: ${reactText()})\n사례: ${caseName}\n① 사건 요약: ${R2.sum}\n② 확인한 사실: ${R2.fact || "-"}\n③ 대응 제안(${R2.who || "-"}): ${R2.fix}\n바뀐 생각: ${R2.me || "-"}`;
    $("#cardout").innerHTML = `<div class="thinkcard" style="margin-top:18px">
      <div class="eyebrow">생각 카드 · ${esc(nick())} · ${e} ${ENDINGS[e].t}</div>
      <h3>${esc(caseName)}</h3>
      <dl><dt>10초 반응</dt><dd>${esc(reactText())}</dd>
      <dt>① 사건 요약</dt><dd>${esc(R2.sum)}</dd>
      <dt>② 확인한 사실</dt><dd>${esc(R2.fact || "-")}</dd>
      <dt>③ 대응 제안</dt><dd>${esc((R2.who ? "[" + R2.who + "] " : "") + R2.fix)}</dd>
      <dt>바뀐 생각</dt><dd>${esc(R2.me || "-")}</dd></dl>
      <p class="hint" style="margin:0">이 카드를 화면 캡처하거나, 글을 복사해 제출하세요.</p>
      <div class="row"><button class="btn sky" id="copy">글 복사하기</button><button class="btn ghost" id="restart">처음부터 다시</button></div>
      <textarea id="copytext" readonly hidden style="width:100%;min-height:160px;border:3px solid var(--ink);padding:8px;font-family:var(--f-body)">${esc(text)}</textarea>
    </div>`;
    $("#cardout").scrollIntoView({ behavior: "smooth", block: "start" });
    $("#copy").onclick = () => {
      const fallback = () => { const t = $("#copytext"); t.hidden = false; t.focus(); t.select(); toast("글을 선택했어요. 길게 눌러 복사하세요"); };
      try { navigator.clipboard.writeText(text).then(() => toast("복사했어요"), fallback); } catch (err) { fallback(); }
    };
    $("#restart").onclick = () => { const r = S.refl, st = S.student; S = blank(); S.refl = r; S.student = st; go(0); };
  });
}

window.addEventListener("beforeunload", e => { if (S.scene >= 2 && S.scene <= 6) { e.preventDefault(); e.returnValue = ""; } });
const SCENES = [sTitle, sPrologue, sTen, sYounghee, sUndo, sAsk, sEnding, sCases];
preloadBG(); preloadProps();
go(0);
</script>
</body>
</html>
