<main id="app">
  <section id="screen-title" class="screen">
    <div id="title-scene" class="title-scene no-art" aria-hidden="true">
      <div class="tl-sky"></div>
      <div class="tl-layer tl-far"></div>
      <div class="tl-layer tl-mid"><i class="tl-spark" style="left:6.5%;top:31%"></i><i class="tl-spark" style="left:14%;top:24%"></i><i class="tl-spark" style="left:27%;top:34%"></i><i class="tl-spark" style="left:36%;top:27%"></i><i class="tl-spark" style="left:44%;top:33%"></i><i class="tl-spark" style="left:56.5%;top:31%"></i><i class="tl-spark" style="left:64%;top:24%"></i><i class="tl-spark" style="left:77%;top:34%"></i><i class="tl-spark" style="left:86%;top:27%"></i><i class="tl-spark" style="left:94%;top:33%"></i></div>

      <div class="tl-rain"></div>
      <div class="tl-stage"><canvas id="title-runner" aria-hidden="true"></canvas></div>
      <div class="tl-cards"></div>
    </div>
    <div class="title-layout">
      <div class="title-wrap">
        <p class="title-kicker">윤리시티 · 데이터 관리 편</p>
        <h1>데이터 러너<span class="title-sub"><span class="title-glitch" data-text="끊어진 도시">끊어진 도시</span><i class="title-link" aria-hidden="true"></i></span></h1>
        <p class="title-lead">비가 오면 도시의 AI가 길을 잃는다. 무엇을 가져와 다시 이을지는 러너가 정한다.</p>
        <div id="title-actions" class="actions"><button id="btn-start" class="btn btn-primary" type="button">시작하기</button></div>
        <p id="title-progress" class="title-progress" hidden></p>
        <div id="title-missions" class="title-missions" role="group" aria-label="임무 고르기"></div>
        <div id="hero-pick" class="hero-pick" role="group" aria-label="달릴 주인공"></div>
      </div>
      <div id="title-guide" class="title-guide"></div>
    </div>
  </section>
  <section id="screen-profile" class="screen" hidden></section>
  <section id="screen-story" class="screen" hidden></section>
  <section id="screen-briefing" class="screen" hidden></section>
  <section id="screen-run" class="screen" hidden>

      <div id="hud-hp" class="hud-hp" role="img" aria-label="HP"></div>
      <div id="hud-progress" class="hud-progress" aria-hidden="true"><i></i></div>
      <button id="btn-mute" class="hud-btn" type="button" aria-label="효과음 끄기">♪</button>
      <button id="btn-pause" class="hud-btn" type="button" aria-label="일시정지">❚❚</button>
    </div>
    <p id="run-hint" class="run-hint" hidden></p>
  </section>
  <section id="screen-inspect" class="screen" hidden></section>
  <section id="screen-supervisor" class="screen" hidden></section>
