<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>게임 아트 보관함</title><link rel="stylesheet" href="style.css"><style>.art-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.art-grid figure{margin:0}.art-grid img{width:100%;height:320px;object-fit:contain;background:#e7e5e0;border-radius:8px}.backgrounds{grid-template-columns:repeat(2,minmax(0,1fr))}.backgrounds img{height:auto}figcaption{font-size:.9rem;margin:8px 0 0}section{margin:32px 0 56px}code{font-size:.75rem;overflow-wrap:anywhere}@media(max-width:650px){.art-grid{grid-template-columns:1fr 1fr}.backgrounds{grid-template-columns:1fr}.art-grid img{height:250px}.backgrounds img{height:auto}}</style></head><body><header><strong>블랙박스를 열어보는 고양이 · 아트 보관함</strong><a href="index.html">게임 열기</a></header><main><h1>모아마을의 장면과 인물</h1><p>배경 4종, 인물 6명과 추가 포즈·표정, 사건 사진 2종, 공통 소품. 문서와 상태 표시는 게임에서 실제 텍스트로 그립니다.</p><section><h2>장소</h2><div id="backgrounds" class="art-grid backgrounds"></div></section><section><h2>인물</h2><div id="characters" class="art-grid"></div></section><section><h2>표정과 소품</h2><div id="props" class="art-grid backgrounds"></div></section><section><h2>사건 사진</h2><div id="evidence" class="art-grid backgrounds"></div></section><p class="hint">일러스트는 AI 이미지 생성 도구로 제작했습니다. 캐릭터 PNG는 투명 채널이 있으며, 일부 가장자리에 반투명 음영이 남습니다. 사진 미리보기는 축제 원본의 실제 픽셀을 잘라 사용합니다.</p></main><script src="story.js"></script><script>
const A=TransparencyStory.art;const groups={backgrounds:[['저녁 골목과 수리점',A.backgrounds[0]],['축제 게시판',A.backgrounds[1]],['학교 복도',A.backgrounds[2]],['빵집 입구',A.backgrounds[3]]],characters:[['모아 · 기본',A.moa],['루루 · 사진',A.lulu],['담이',A.dami],['밤이',A.bami],['교사',A.teacher],['점원 · 제한',A.clerk],['루루 · 원고',A.luluPaper],['점원 · 재검토',A.clerkOpen]],props:[['모아 · 놀람 / 의심 / 집중 / 안도',A.expressions],['상자 / 작은 창 / 수첩 / 편지 / 원고 / 예약표',A.props]],evidence:[['축제 사진 원본',A.photo],['흐릿한 가상 얼굴 비교',A.faces],['같은 원본에서 자른 자동 미리보기','assets/s01/festival-preview-auto.png'],['같은 원본에서 자른 담이 중심','assets/s01/festival-preview-dami.png']]};Object.entries(groups).forEach(([id,items])=>{document.getElementById(id).innerHTML=items.map(([name,src])=>`<figure><a href="${src}" target="_blank"><img src="${src}" alt="${name}"></a><figcaption>${name}<br><code>${src}</code></figcaption></figure>`).join('');});
</script></body></html>
