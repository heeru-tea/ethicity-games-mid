<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>나이트폭스 · 사건 일러스트</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f3f5f7; color: #202d3b; font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; line-height: 1.6; }
    main { max-width: 1320px; margin: auto; padding: 48px 32px; }
    header { border-bottom: 1px solid #ccd4dc; padding-bottom: 24px; margin-bottom: 28px; }
    .eyebrow { color: #376482; font-size: 12px; font-weight: 700; letter-spacing: .12em; }
    h1 { margin: 8px 0; font-size: clamp(24px, 4vw, 34px); letter-spacing: -.04em; }
    header p { margin: 0; color: #536171; }
    #status { margin-top: 12px; font-size: 13px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 24px; }
    figure { margin: 0; overflow: hidden; border: 1px solid #d8dee5; border-radius: 10px; background: #fff; }
    .frame { aspect-ratio: 16 / 9; background: #e7ecf1; }
    img { display: block; width: 100%; height: 100%; object-fit: contain; }
    figcaption { padding: 14px 18px 16px; }
    h2 { margin: 0; font-size: 16px; font-weight: 700; }
    .file, .meta { display: block; font-size: 12px; color: #536171; overflow-wrap: anywhere; }
    .file { margin: 3px 0; font-family: Consolas, monospace; }
    .error { color: #a32828; }
    footer { margin-top: 28px; font-size: 13px; color: #536171; }
    @media (max-width: 640px) { main { padding: 28px 16px; } .grid { grid-template-columns: 1fr; gap: 20px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">공유한 순간 / SPECIAL EPISODE</div>
      <h1>나이트폭스, 그날의 장면들</h1>
      <p>도착부터 선생님의 도움까지 · 남녀 주인공 8장과 공통 시점 2장</p>
      <p id="status" role="status">이미지 10장을 확인하고 있습니다.</p>
    </header>
    <section class="grid" id="sheet" aria-label="사건 일러스트 10장"></section>
    <footer>16:9 전체 화면용 배경 포함 일러스트 · 원본 전체 표시 · 대사와 선택지는 별도 UI</footer>
  </main>
  <script>
    const assets = [
      ['boy-arrival', '남학생 · 현장 도착'], ['girl-arrival', '여학생 · 현장 도착'],
      ['boy-confrontation', '남학생 · 나이트폭스와 대치'], ['girl-confrontation', '여학생 · 나이트폭스와 대치'],
      ['boy-clash', '남학생 · 갈등이 고조되는 순간'], ['girl-clash', '여학생 · 갈등이 고조되는 순간'],
      ['boy-recorded', '남학생 · 촬영되는 사건'], ['girl-recorded', '여학생 · 촬영되는 사건'],
      ['classroom-reaction', '공통 시점 · 교실의 반응'], ['teacher-support', '공통 시점 · 선생님의 도움']
    ];
    window.assetChecks = [];
    window.assetChecksReady = false;
    const jobs = assets.map(([id, name]) => new Promise(resolve => {
      const figure = document.createElement('figure');
      const frame = document.createElement('div');
      frame.className = 'frame';
      const img = document.createElement('img');
      img.alt = name;
      img.loading = 'eager';
      const caption = document.createElement('figcaption');
      const heading = document.createElement('h2');
      heading.textContent = name;
      const filename = document.createElement('span');
      filename.className = 'file';
      filename.textContent = id + '.png';
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = '불러오는 중';
      caption.append(heading, filename, meta);
      frame.append(img);
      figure.append(frame, caption);
      document.querySelector('#sheet').append(figure);
      const finish = result => {
        window.assetChecks.push(result);
        meta.textContent = result.error || `${result.width} × ${result.height} · ${result.opaque ? '불투명' : '투명 픽셀 있음'} · ${result.ratioValid ? '16:9' : '비율 확인 필요'}`;
        if (result.error || !result.opaque || !result.ratioValid) meta.classList.add('error');
        resolve();
      };
      img.onerror = () => finish({file: id + '.png', name, width: 0, height: 0, error: '이미지 로드 실패'});
      img.onload = () => {
        const result = {file: id + '.png', name, width: img.naturalWidth, height: img.naturalHeight, error: null};
        try {
          const canvas = document.createElement('canvas');
          canvas.width = result.width;
          canvas.height = result.height;
          const ctx = canvas.getContext('2d', {willReadFrequently: true});
          ctx.drawImage(img, 0, 0);
          const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
          let transparentPixels = 0;
          for (let i = 3; i < pixels.length; i += 4) if (pixels[i] !== 255) transparentPixels++;
          result.transparentPixels = transparentPixels;
          result.opaque = transparentPixels === 0;
          result.ratio = result.width / result.height;
          // Allow at most one pixel of rounding in the intended 16:9 height.
          result.ratioValid = Math.abs(result.height - result.width * 9 / 16) <= 1;
        } catch (error) { result.error = '픽셀 검사 실패: ' + error.message; }
        finish(result);
      };
      img.src = id + '.png';
    }));
    Promise.all(jobs).then(() => {
      window.assetChecks.sort((a, b) => assets.findIndex(x => x[0] + '.png' === a.file) - assets.findIndex(x => x[0] + '.png' === b.file));
      const failed = window.assetChecks.filter(x => x.error || !x.opaque || !x.ratioValid).length;
      document.querySelector('#status').textContent = failed ? `10장 중 ${failed}장 확인 필요` : '10장 로드 완료 · 불투명 배경 및 16:9 확인';
      window.assetChecksReady = true;
    });
  </script>
</body>
</html>
