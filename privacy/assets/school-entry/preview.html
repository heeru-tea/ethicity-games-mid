<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>학교 진입부·문 에셋</title>
<style>body{font-family:system-ui,sans-serif;background:#edf1eb;color:#243e39;margin:32px}h1{font-size:26px}p{line-height:1.6}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px}figure{margin:0;background:white;border:1px solid #cbd5cd;border-radius:12px;padding:16px}canvas{width:100%;height:260px;object-fit:contain;background:#e2e9dc}figcaption{font-weight:600;margin-top:12px}small{display:block;margin-top:6px;color:#53685e}</style>
<h1>학교 진입부와 실내 문</h1><p>에셋 납품 미리보기입니다. 실제 게임에 연결된 화면이 아닙니다.<br>외관·포장 광장·교실문과 도서관문의 열린 상태 및 닫힌 상태입니다.</p><main></main>
<script>
const entries=[['exterior-v2','학교 외관 개선'],['forecourt','포장 광장'],['door-classroom-closed','교실문 · 닫힘'],['door-classroom-open','교실문 · 열림'],['door-library-closed','도서관문 · 닫힘'],['door-library-open','도서관문 · 열림']];
window.assetChecks=[];
entries.forEach(([name,label])=>{const f=document.createElement('figure'),c=document.createElement('canvas'),caption=document.createElement('figcaption'),meta=document.createElement('small');c.width=600;c.height=520;caption.textContent=label;f.append(c,caption,meta);document.querySelector('main').append(f);const im=new Image();im.onload=()=>{const temp=document.createElement('canvas');temp.width=im.width;temp.height=im.height;const g=temp.getContext('2d');g.drawImage(im,0,0);let box=[0,0,im.width,im.height],transparent=0;try{const data=g.getImageData(0,0,im.width,im.height).data;let l=im.width,t=im.height,r=-1,b=-1;for(let y=0;y<im.height;y++)for(let x=0;x<im.width;x++){let a=data[(y*im.width+x)*4+3];if(a===0)transparent++;if(a<16)continue;l=Math.min(l,x);t=Math.min(t,y);r=Math.max(r,x);b=Math.max(b,y);}box=[l,t,r-l+1,b-t+1];}catch(e){meta.textContent='HTTP로 열면 투명 여백을 제외합니다. ';}const scale=Math.min(560/box[2],480/box[3]);c.getContext('2d').drawImage(im,...box,(600-box[2]*scale)/2,(520-box[3]*scale)/2,box[2]*scale,box[3]*scale);meta.textContent+=im.width+' × '+im.height+' · '+name+'.png';window.assetChecks.push({name,width:im.width,height:im.height,box,transparent});};im.onerror=()=>{meta.textContent='이미지 로드 실패';window.assetChecks.push({name,error:true});};im.src=name+'.png';});
</script></html>
