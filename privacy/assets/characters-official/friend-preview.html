<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>옆 반 친구 비교</title><style>body{margin:24px;background:#f4f6f5;color:#263a32;font:16px/1.6 system-ui,sans-serif}main{max-width:1320px;margin:auto}h1{font-size:26px}h2{font-size:20px;margin:28px 0 8px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}figure{margin:0}img{max-width:100%;image-rendering:pixelated}figcaption{padding:4px 0}button{min-height:44px;padding:8px 20px}table{border-collapse:collapse}th,td{padding:8px 24px;text-align:left;border-bottom:1px solid #ccd5cf}canvas{image-rendering:pixelated;background:#e1e8e2;width:81.6px;height:108.8px}</style><main><h1>옆 반 친구 · 공식 캐릭터 비교</h1><p>같은 축척 0.85 · 걷기 6fps · 정지 프레임 1 · 아래/왼쪽/오른쪽/위</p><button id="toggle">정지하기</button><table><tr><th>방향</th><th>friend</th><th>jiho</th><th>saebom</th><th>daon</th></tr><tr><th>아래</th><td><canvas width="96" height="128" data-id="friend" data-row="0"></canvas></td><td><canvas width="96" height="128" data-id="jiho" data-row="0"></canvas></td><td><canvas width="96" height="128" data-id="saebom" data-row="0"></canvas></td><td><canvas width="96" height="128" data-id="daon" data-row="0"></canvas></td></tr><tr><th>왼쪽</th><td><canvas width="96" height="128" data-id="friend" data-row="1"></canvas></td><td><canvas width="96" height="128" data-id="jiho" data-row="1"></canvas></td><td><canvas width="96" height="128" data-id="saebom" data-row="1"></canvas></td><td><canvas width="96" height="128" data-id="daon" data-row="1"></canvas></td></tr><tr><th>오른쪽</th><td><canvas width="96" height="128" data-id="friend" data-row="2"></canvas></td><td><canvas width="96" height="128" data-id="jiho" data-row="2"></canvas></td><td><canvas width="96" height="128" data-id="saebom" data-row="2"></canvas></td><td><canvas width="96" height="128" data-id="daon" data-row="2"></canvas></td></tr><tr><th>위</th><td><canvas width="96" height="128" data-id="friend" data-row="3"></canvas></td><td><canvas width="96" height="128" data-id="jiho" data-row="3"></canvas></td><td><canvas width="96" height="128" data-id="saebom" data-row="3"></canvas></td><td><canvas width="96" height="128" data-id="daon" data-row="3"></canvas></td></tr></table><h2>표정 비교 · neutral / happy / worried / explaining</h2><h3>friend</h3><img alt="friend 표정 4종" src="friend-portraits.png"><h3>jiho</h3><img alt="jiho 표정 4종" src="../../../shared/ethicity-elementary-common-v1/characters/jiho-portraits.png"><h3>saebom</h3><img alt="saebom 표정 4종" src="../../../shared/ethicity-elementary-common-v1/characters/saebom-portraits.png"><h3>daon</h3><img alt="daon 표정 4종" src="../../../shared/ethicity-elementary-common-v1/characters/daon-portraits.png"><script>const ids=["friend","jiho","saebom","daon"],sources={"friend":"friend-walk.png","jiho":"../../../shared/ethicity-elementary-common-v1/characters/jiho-walk.png","saebom":"../../../shared/ethicity-elementary-common-v1/characters/saebom-walk.png","daon":"../../../shared/ethicity-elementary-common-v1/characters/daon-walk.png"};const images={};let run=!matchMedia("(prefers-reduced-motion: reduce)").matches,frame=1;function draw(){for(const c of document.querySelectorAll("canvas")){const x=c.getContext("2d");x.imageSmoothingEnabled=false;x.clearRect(0,0,96,128);x.drawImage(images[c.dataset.id],frame*96,Number(c.dataset.row)*128,96,128,0,0,96,128)}}Promise.all(ids.map(id=>new Promise((yes,no)=>{const im=new Image;im.onload=()=>{images[id]=im;yes()};im.onerror=no;im.src=sources[id]}))).then(()=>{draw();window.previewReady=true;setInterval(()=>{if(run){frame=(frame+1)%4;draw()}},1000/6)});document.getElementById("toggle").onclick=()=>{run=!run;if(!run)frame=1;draw();document.getElementById("toggle").textContent=run?"정지하기":"걷기 재생"};</script></main></html>
