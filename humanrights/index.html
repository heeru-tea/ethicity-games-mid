<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI 안면인식 심의위원회 — 윤리시티 인권보장</title>
  <meta name="description" content="윤리시티 안전위원회 위원이 되어 건물 출입·채용·치안 분야의 AI 안면인식 도입 안건을 심의하는 인권보장 시뮬레이션 게임">
  <link rel="stylesheet" href="../shared/ethicity-elementary-common-v1/runtime/common.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="ee-theme">
  <header class="topbar">
    <div class="brand">
      <span class="logo">윤리시티 안전위원회</span>
      <span class="where" id="where"></span>
    </div>
    <button type="button" class="ee-button secondary menu-btn" data-action="menu" aria-haspopup="dialog">메뉴</button>
  </header>
  <nav class="progress-wrap" aria-label="진행 단계"><ol class="progress" id="progress"></ol></nav>

  <p class="ee-notice storage-note" id="storage-note" hidden>이 브라우저에서는 저장이 막혀 있어요. 새로고침하면 처음부터 다시 시작해요. 끝까지 마친 뒤 보고서를 PDF로 저장하세요.</p>

  <main id="app" tabindex="-1"></main>
  <div class="nav" id="nav"></div>

  <dialog id="confirm" class="ee-panel">
    <form method="dialog">
      <p id="confirm-text"></p>
      <p class="actions">
        <button class="ee-button secondary" value="cancel">취소</button>
        <button class="ee-button" value="ok">확인</button>
      </p>
    </form>
  </dialog>

  <dialog id="menu" class="ee-panel" aria-labelledby="menu-title">
    <form method="dialog">
      <h2 id="menu-title">메뉴</h2>
      <label class="opt"><input type="checkbox" id="opt-sound"> 효과음 켜기</label>
      <label class="opt">반론 검토에 쓸 반론 (교사용)
        <select id="opt-rebuttal"></select>
      </label>
      <p class="muted">주소에 <code>?rebuttal=safety</code>·<code>cost</code>·<code>majority</code>를 붙여도 바꿀 수 있어요.</p>
      <p class="actions">
        <button type="button" class="ee-button secondary" id="opt-clear">이 게임 기록 지우기</button>
        <button class="ee-button" value="close">닫기</button>
      </p>
    </form>
  </dialog>

  <script src="../shared/ethicity-elementary-common-v1/runtime/manifest.js"></script>
  <script src="../shared/ethicity-elementary-common-v1/runtime/common.js"></script>
  <script src="js/config.js"></script>
  <script src="js/stories.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
